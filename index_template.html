<!-- index_template.html -->
<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Portal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Outfit:wght@700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0f172a;
            --card-bg: #1e293b;
            --text: #f8fafc;
            --text-dim: #94a3b8;
            --accent: #38bdf8;
            --accent-glow: rgba(56, 189, 248, 0.2);
            --danger: #ef4444;
            --danger-glow: rgba(239, 68, 68, 0.3);
        }
        body {
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            width: 100%;
            max-width: 800px;
            padding: 4rem 2rem;
            box-sizing: border-box;
        }
        h1 {
            font-family: 'Outfit', sans-serif;
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
            background: linear-gradient(135deg, #fff 0%, var(--accent) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .subtitle {
            color: var(--text-dim);
            margin-bottom: 1.5rem;
            font-size: 1.1rem;
        }
        .toolbar {
            display: flex;
            justify-content: flex-end;
            margin-bottom: 1.5rem;
        }
        .edit-toggle {
            background: transparent;
            border: 1px solid var(--text-dim);
            color: var(--text-dim);
            padding: 0.5rem 1rem;
            border-radius: 8px;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.3s;
        }
        .edit-toggle:hover, .edit-toggle.active {
            border-color: var(--danger);
            color: var(--danger);
        }
        .project-list {
            display: grid;
            gap: 1rem;
        }
        .project-card-wrapper {
            position: relative;
        }
        .project-card {
            background: var(--card-bg);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 1.5rem;
            border-radius: 12px;
            text-decoration: none;
            color: inherit;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .project-card:hover {
            transform: translateY(-2px);
            border-color: var(--accent);
            box-shadow: 0 10px 30px -10px var(--accent-glow);
        }
        .project-info h3 {
            margin: 0;
            font-size: 1.25rem;
        }
        .project-info p {
            margin: 0.25rem 0 0;
            color: var(--text-dim);
            font-size: 0.9rem;
        }
        .arrow {
            width: 24px;
            height: 24px;
            fill: var(--accent);
        }
        .delete-btn {
            display: none;
            position: absolute;
            top: 50%;
            right: 12px;
            transform: translateY(-50%);
            background: var(--danger);
            border: none;
            color: white;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            font-size: 1.2rem;
            cursor: pointer;
            z-index: 10;
            transition: box-shadow 0.3s;
        }
        .delete-btn:hover {
            box-shadow: 0 0 15px var(--danger-glow);
        }
        body.edit-mode .delete-btn {
            display: block;
        }
        body.edit-mode .project-card {
            pointer-events: none;
            opacity: 0.7;
        }
        body.edit-mode .project-card-wrapper:hover .project-card {
            border-color: var(--danger);
        }

        /* 確認ダイアログ */
        .confirm-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.7);
            z-index: 100;
            align-items: center;
            justify-content: center;
        }
        .confirm-overlay.show { display: flex; }
        .confirm-box {
            background: var(--card-bg);
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 16px;
            padding: 2rem;
            text-align: center;
            max-width: 320px;
            width: 90%;
        }
        .confirm-box h3 { margin-top: 0; }
        .confirm-box .project-name {
            color: var(--danger);
            font-weight: 700;
            font-size: 1.2rem;
        }
        .confirm-btns {
            display: flex;
            gap: 1rem;
            margin-top: 1.5rem;
        }
        .confirm-btns button {
            flex: 1;
            padding: 0.8rem;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
        }
        .btn-cancel {
            background: #334155;
            color: var(--text);
        }
        .btn-confirm-delete {
            background: var(--danger);
            color: white;
        }

        footer {
            margin-top: auto;
            padding: 2rem;
            color: var(--text-dim);
            font-size: 0.8rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Project Portal</h1>
        <p class="subtitle">Deployed Workspaces & Experiments</p>
        <div class="toolbar">
            <button class="edit-toggle" onclick="toggleEditMode()">🗑️ 編集</button>
        </div>
        <div class="project-list">
            <!-- PROJECT_LIST_HOLDER -->
        </div>
    </div>

    <div class="confirm-overlay" id="confirmOverlay">
        <div class="confirm-box">
            <h3>本当に削除しますか？</h3>
            <p><span class="project-name" id="deleteTargetName"></span></p>
            <p style="color:var(--text-dim);font-size:0.85rem;">サーバーから完全に削除されます。</p>
            <div class="confirm-btns">
                <button class="btn-cancel" onclick="closeConfirm()">キャンセル</button>
                <button class="btn-confirm-delete" onclick="confirmDelete()">削除する</button>
            </div>
        </div>
    </div>

    <footer>
        &copy; 2026 Deployed via Antigravity Deployer
    </footer>

    <script>
        let editMode = false;
        let pendingDelete = null;

        function toggleEditMode() {
            editMode = !editMode;
            document.body.classList.toggle('edit-mode', editMode);
            const btn = document.querySelector('.edit-toggle');
            btn.textContent = editMode ? '✅ 完了' : '🗑️ 編集';
            btn.classList.toggle('active', editMode);
        }

        function requestDelete(name) {
            pendingDelete = name;
            document.getElementById('deleteTargetName').textContent = name;
            document.getElementById('confirmOverlay').classList.add('show');
        }

        function closeConfirm() {
            document.getElementById('confirmOverlay').classList.remove('show');
            pendingDelete = null;
        }

        function confirmDelete() {
            if (!pendingDelete) return;
            const name = pendingDelete;
            closeConfirm();

            fetch('delete.php', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    token: 'antigravity-delete-2026',
                    project: name
                })
            })
            .then(r => r.json())
            .then(data => {
                if (data.success) {
                    const wrapper = document.querySelector(`[data-project="${name}"]`);
                    if (wrapper) {
                        wrapper.style.transition = 'all 0.3s';
                        wrapper.style.opacity = '0';
                        wrapper.style.transform = 'translateX(100px)';
                        setTimeout(() => wrapper.remove(), 300);
                    }
                } else {
                    alert('削除に失敗しました: ' + (data.error || '不明なエラー'));
                }
            })
            .catch(() => alert('通信エラーが発生しました'));
        }
    </script>
</body>
</html>
